<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DLX Sudoku Solver</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>DLX Sudoku Solver</h1>
    <p class="subtitle">Sudoku solver using Algorithm X with Dancing Links</p>

    <div id="sudoku-board" class="board"></div>

    <div class="controls">
      <button id="solve-btn">Solve</button>
      <button id="clear-btn">Clear</button>
      <button id="example-btn">Load Example</button>
    </div>

    <div class="output-section">
      <p id="message" class="message"></p>
      <pre id="board-output" class="board-output"></pre>
    </div>
  </div>

  <script src="solver.js"></script>
</body>
</html>
